name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install GTK runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y python3 python3-gi gir1.2-gtk-4.0
      - name: Shell syntax
        run: bash -n install.sh uninstall.sh packaging/build-deb.sh packaging/debian/postinst packaging/debian/postrm
      - name: Compile
        run: PYTHONPATH=src python3 -m compileall -q src tests
      - name: Unit tests
        run: PYTHONPATH=src python3 -m unittest discover -s tests -v
      - name: Import GTK frontend
        run: PYTHONPATH=src python3 -c 'from nativedev.gui import NativeDevApplication; print("GTK import OK")'
      - name: Build Debian package
        run: ./packaging/build-deb.sh --output-dir dist
      - name: Inspect Debian package
        run: |
          dpkg-deb --info dist/nativedev_*_all.deb
          dpkg-deb --contents dist/nativedev_*_all.deb | grep -E '/usr/bin/nativedev$|/usr/lib/nativedev/privileged_helper.py$|io.github.nativedev.policy$'
      - uses: actions/upload-artifact@v4
        with:
          name: nativedev-deb
          path: dist/nativedev_*_all.deb
