name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install GTK runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y python3 python3-gi gir1.2-gtk-4.0
      - name: Compile
        run: PYTHONPATH=src python3 -m compileall -q src tests
      - name: Unit tests
        run: PYTHONPATH=src python3 -m unittest discover -s tests -v
      - name: Import GTK frontend
        run: PYTHONPATH=src python3 -c 'from nativedev.gui import NativeDevApplication; print("GTK import OK")'
